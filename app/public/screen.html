<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outfit Lab</title>
  <link rel="stylesheet" href="/admin.css">
  <script type="module" src="/screen.js"></script>
</head>
<body id="screen">
  <main id="slide" class="slide"></main>
  <div id="qr" class="slide qr-overlay" hidden>
    <div class="sl kind-join"><div class="sl-join">
      <div class="sl-join-text">
        <p class="sl-kicker">Outfit Lab</p>
        <h1 class="sl-url"></h1>
        <p class="sl-line">Open the link and type your name. The app picks your lab.</p>
      </div>
      <img class="sl-qr" alt="QR code for the join link">
    </div></div>
  </div>
  <p id="keys-hint" class="keys-hint">F full screen · → next · ← back</p>
</body>
</html>
